# =============================================================================
# 单机无人值守批量视频处理系统 —— 配置
# 主要参数基准：22 核 CPU / 16GB RAM / 8GB 显存 GPU + 支持 QSV 的集显 / 50GB 可用磁盘
#
# 路径约定：本文件中以 ./ 或 ../ 开头的路径，一律相对于「本配置文件所在目录」
#          解析为绝对路径（见 pipeline/config.py::Config.resolve_tools）。
# =============================================================================

paths:
  input: "./input"
  work: "./work"
  output: "./output"
  failed: "./failed"
  logs: "./logs"
  database: "./pipeline.db"

# ---------------------------------------------------------------------------
# 资源限制：16GB RAM，严禁通过大量并发换取吞吐
# ---------------------------------------------------------------------------
resources:
  cpu_cores: 22
  ram_total_gb: 16
  # 阈值按 16GB 机器的实际基线放宽：用默认 80/92 时，常驻应用占用偏高会让
  # ram_allows_new_stage() 长期返回 False、流水线在 _wait_resources 死等超时。
  # 换到内存更空闲的机器可调回 80/92。
  ram_soft_limit_percent: 92      # RAM 超过 92%：禁止启动新阶段
  ram_hard_limit_percent: 97      # RAM 超过 97%：暂停/降级
  max_video_ai_jobs: 1            # 绝不允许两个 AI 视频同时抢同一块推理卡
  max_audio_jobs: 1
  max_transcode_jobs: 1
  monitor_interval_seconds: 15

scheduler:
  max_active_video_workspaces: 1  # 同一时间只有一个视频占用 work/current
  poll_interval_seconds: 10

# ---------------------------------------------------------------------------
# 磁盘：50GB 可用，第一优先级调度约束
# ---------------------------------------------------------------------------
disk:
  total_available_gb: 50
  safe_start_gb: 30               # >= 30GB：允许启动新任务
  pause_new_jobs_gb: 20           # 20~30GB：只继续当前任务
  cleanup_gb: 15                  # 10~15GB：EMERGENCY_CLEANUP
  emergency_stop_gb: 10           # < 10GB：停止流水线
  safety_margin_gb: 8
  video_temp_multiplier: 1.5      # 空间预估：源大小 × 1.5
  audio_temp_multiplier: 0.2
  output_multiplier: 1.2

# ---------------------------------------------------------------------------
# GPU：NVIDIA 卡只负责 AI 视频修复；集显优先 QSV 编码
# ---------------------------------------------------------------------------
gpu:
  ai_gpu:
    type: "nvidia"
    index: 0
  encode_gpu:
    type: "intel"
    index: 1

# ===========================================================================
# 视频 AI 修复：REAL-Video-Enhancer 2.4.1（后端 CLI 直驱，绕开 GUI）
#
# 关键点：
#   * RVE 的 Windows 发行版是 PyQt GUI；本流水线直接调用其推理后端
#     `tools/backend/rve-backend.py`（标准 argparse CLI），实现无人值守。
#   * RVE 的“放大倍率”由**模型文件**决定；此处通过 models.upscale 映射
#     profile 给出的 scale（1/2/4）→ 对应模型路径。
#   * args_template 中的 **列表项表示可选参数组**：组内任一占位符解析为空
#     字符串时整组丢弃（例如 scale=1 时自动不传 --upscale_model）。
#   * executable 是 RVE 专用解释器；torch/numpy 与 DeepFilterNet 冲突
#     （RVE 需 numpy 2.x，DeepFilterNet 需 numpy<2），故必须独立环境。
#
# device 切换：
#   device: cuda → 需 CUDA 版 torch（torch==2.7.0+cu128）
#                  实测：2 秒视频约 16 秒跑完（CPU 需 365~552 秒，约 22~34x）
#   device: cpu  → CPU 版 torch（torch==2.5.1+cpu）仅建议做功能验证
#   安装：powershell -ExecutionPolicy Bypass -File scripts\setup_ai_tools.ps1 -Cuda
#   自检：./.venv-rve/Scripts/python.exe scripts/verify_cuda.py --bench
# ===========================================================================
video_repair:
  enabled: true
  # ---- 修复档位（用户可直接选，不需要改模型开关）----
  #   auto     自动：由 pipeline/planner.py 按片源特征 + 时间预算自动选（默认）
  #   light    仅转码：不做任何 AI 修复，只规范化容器与编码
  #   standard 中档：2x AI 超分 + DeepFilterNet 音质降噪（不做压缩伪影修复）
  #   full     完全修复：1x 压缩伪影修复 + 2x 超分 + 音质降噪
  # 三档的「修复范围 / 修复深度 / 具体操作」详见：python main.py tiers
  # CLI 覆盖：python main.py --tier standard scan && python main.py --tier standard run
  tier: "auto"
  backend: "real-video-enhancer"  # real-video-enhancer | none
  infer_backend: "pytorch"        # RVE 推理后端: pytorch | ncnn | tensorrt
  device: "cuda"                  # cuda（需 CUDA 版 torch）| cpu
  precision: "auto"               # auto | float16 | float32
  gpu_index: 0
  model: "auto"
  denoise: true
  deblock: true                   # true → 传 --extra_restoration_models 做压缩修复
  upscale: true
  scale_mode: "auto"              # auto | 1x | 2x | 4x（不要盲目固定 4x）
  interpolation: false            # 默认禁止插帧
  tile: 0                         # 0=整帧推理（CUDA 下推荐，最快）。显存不足报 OOM 时改 512/256；
                                  # CPU 模式务必设 128，否则会因内存耗尽崩溃（rc=3221225477）
  crf: 16                         # RVE 内部编码质量
  encoder: "libx264"              # RVE 中间产物编码器；CPU 下 libx264 明显快于 libx265
  timeout_seconds: 14400          # 4h，仅作**兜底下限**。
                                  # 实际值由 pipeline/planner.py 按「耗时预估 × 安全系数」
                                  # 逐任务自动推导，不会再出现"改了档位忘了同步 timeout、
                                  # 结果 RVE 被当成超时杀掉"的情况。
  executable: "./.venv-rve/Scripts/python.exe"
  args_template:
    - "./tools/backend/rve-backend.py"
    - "-i"
    - "{input}"
    - "-o"
    - "{output}"
    - ["--extra_restoration_models", "{decompress_model}"]
    - ["--upscale_model", "{upscale_model}"]
    - "--device"
    - "{device}"
    - "--backend"
    - "{infer_backend}"
    - "--precision"
    - "{precision}"
    - "--pytorch_gpu_id"
    - "{gpu_index}"
    - ["--tilesize", "{tile}"]
    - ["--ffmpeg_path", "{ffmpeg_path}"]
    - "--overwrite"
    - "--crf"
    - "{crf}"
    - "--video_encoder_preset"
    - "{encoder}"
    - "--audio_encoder_preset"
    - "aac"
  # ---- 自动档位（建议保持 enabled: true，不要手工写死模型开关）----
  # 实测：1x 压缩修复模型（RealPLKSR）比 2x 超分模型（SPAN）慢约 9 倍。
  #   68min / 712x400 片源：完整档(1x+2x) 约 14.8h，快速档(仅2x) 约 1.5h，
  #   音质 DeepFilterNet 约 7min。
  # 因此流水线会自动决定是否启用压缩修复，判据两条：
  #   1) 片源是否有压缩伪影特征（编码 h264/wmv3/mpeg4… 或容器 asf/wmv/avi）
  #   2) 在「总预算 ÷ 队列长度」得到的单文件预算内，跑不跑得起完整档
  # 队列越长 → 单文件预算越小 → 自动退回快速档，避免做出要跑几天的配置。
  # 决策会写进 logs/jobs/<id>.log；开跑前可先看数：python main.py estimate
  auto:
    enabled: true
    total_budget_hours: 12        # 单次 run 的画质 AI 总时长预算（按队列长度分摊）
  models:
    upscale:
      "2x": "./tools/models/2x_OpenProteus_Compact_i2_70K.pth"
      # "4x": "./tools/models/4xNomos8k_span_otf_medium.pth"   # 需先下载
    # 1x 压缩伪影修复模型。填上即代表"具备该能力"，是否实际使用由 auto 决定；
    # 想强制关闭可把 auto.enabled 设为 false 并把这里置为 null。
    decompress: "./tools/models/1xDeH264_realplksr.pth"
  # RVE 内部调用 ffmpeg 时使用；./ 开头 → 相对于本配置文件目录解析
  ffmpeg_path: "./.tools/ffmpeg/ffmpeg.exe"
  extra_args: []

# ===========================================================================
# 音频处理：默认**关闭 AI 降噪**（保持源声场完整）
#
# 为什么关掉 DeepFilterNet（实测结论，勿轻易改回）：
#   DFN 是**语音增强**模型，设计目标是"提取人声、抑制非语音"。对课程录像
#   这类需要完整声场的素材，它会把环境音/音乐/混响当噪声**整体重新合成**，
#   而不是按 dB 衰减。对 录像01 同一 60 秒段落实测（对比"不做 DFN"的对照）：
#     * 3–6 kHz 能量占比 26.2% → 10.7%（砍掉近 60%）→ 听感"模糊不清"
#     * 频谱质心 1754 Hz → 1171 Hz（整体变闷）
#     * 波形相关系数 -0.001（几乎零相关，说明是重合成而非增强）
#     * RMS 电平 -30.1 dB → -34.7 dB
#   叠加因素：本批 37 个源片全部是 mono / 22050 Hz / 20 kbps 的 wmav2，
#   DFN 在 48 kHz 上训练，对这种低采样率低码率输入处理异常。
#   调 --atten-lim 也救不了——模型输出是重合成，不是衰减。
#
# 关闭后的行为：只把源音频重编码为 AAC 320k / 48 kHz（声场百分之百保留），
# 代价是源本身的底噪与压缩伪影也会保留。
# ===========================================================================
audio_repair:
  enabled: false                  # true 会启用下面的 deepfilternet 后端
  backend: "deepfilternet"        # deepfilternet | clearervoice | none
  executable: "./.venv/Scripts/python.exe"
  sample_rate: 48000
  bitrate: "320k"
  timeout_seconds: 14400
  # ---- 长音频内存适配（重要）----
  # DeepFilterNet 把整个文件读成浮点数组，峰值内存 ≈ 数据量的 3 倍：
  # 68min 立体声 48kHz 需 ~3.15GB，在 16GB 机器上必然 OOM。
  # 因此超过「按下述上限与可用内存算出的单段时长」的音频会自动分段处理，
  # 段间做交叉淡化，最后拼接并把长度对齐回原始帧数。
  max_segment_seconds: 120        # 单段最长 2 分钟（越小越省内存）
  crossfade_seconds: 0.05         # 段间交叉淡化 50ms
  # 若仍因内存不足失败，适配器会把段长自动对半降低后重试（直到 30 秒），
  # 因此不需要按机器手工调参。
  args_template:
    - "./tools/df_enhance_cli.py"
    - "{input}"
    - "--output-dir"
    - "{output_dir}"
    - "--log-level"
    - "error"
  extra_args: []

# ---------------------------------------------------------------------------
# 目标交付格式：MP4 / H.265 / AAC 320k / 48kHz
# ---------------------------------------------------------------------------
output:
  container: "mp4"
  video_codec: "hevc"             # h264 | hevc | av1
  audio_codec: "aac"
  audio_bitrate: "320k"
  sample_rate: 48000
  keep_subtitles: true
  keep_metadata: true

# ---------------------------------------------------------------------------
# 编码后端优先级：Intel QSV → NVIDIA NVENC → CPU
# ---------------------------------------------------------------------------
encoder:
  prefer: ["qsv", "nvenc", "cpu"]
  qsv_preset: "medium"
  cpu_preset: "medium"
  crf: 23

retry:
  # 3 次（=首次 + 2 次重试）。RVE 在长视频上偶发内存耗尽（实测约 1/4 概率，
  # 长片源更明显），而每次重试都是**全新的 RVE 进程**，成功率高；
  # 因此留出 2 次重试，把最终失败率从 ~6% 降到 ~2%。
  max_attempts: 3
  backoff_seconds: 30

verify:
  duration_tolerance_seconds: 2
  require_video: true
  require_audio: true
  min_size_bytes: 10000

# 默认禁止 FFV1+PCM 巨型无损中间文件；仅输入无法直接处理时按需生成
intermediate:
  lossless: false

input:
  extensions:
    - ".mp4"
    - ".avi"
    - ".wmv"
    - ".mkv"
    - ".mov"
    - ".flv"
    - ".webm"
    - ".mpg"
    - ".mpeg"
    - ".3gp"

# ---------------------------------------------------------------------------
# 处理策略：按分辨率自动选择，可按文件名覆盖
#   light      >=1080p     ：不超分，轻度降噪
#   course_720  720p 左右  ：2x 超分 + 轻度降噪
#   legacy     <=480p/老容器：去压缩 + 降噪 + 2x
# ---------------------------------------------------------------------------
profiles:
  auto_select: true
  overrides: {}
  # overrides:
  #   "S01E04.mp4": "legacy"

# ---------------------------------------------------------------------------
# 进度监控（只读旁观者，不参与处理）
#   python main.py dashboard   本地 Web 看板（绑 127.0.0.1，浏览器打开）
#   python main.py monitor     终端实时监控（原地重绘）
#   双击 dashboard.bat         等价于 dashboard --open
#
# 进度与剩余时间由**历史实测阶段耗时**推算（截尾中位数），不改数据库表结构；
# 因此刚跑第一批时估算偏粗，随着已完成作业增多会越来越准。
# ---------------------------------------------------------------------------
dashboard:
  port: 8765
  interval_seconds: 3          # Web 看板刷新间隔（秒）
  tui_interval_seconds: 5      # 终端 TUI 刷新间隔（秒）
  model_ttl_seconds: 60        # 阶段耗时模型缓存时长，防百分比抖动
